version: "2"
run:
  concurrency: 4
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - govet
    - goconst
    - godox
    - gomodguard_v2
    - misspell
    - nakedret
    - noctx
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: true
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 10
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - regexpMust
      enabled-tags:
        - performance
      disabled-tags:
        - experimental
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10
    godox:
      keywords:
        - FIXME
        - BUG
        - XXX
    govet:
      enable-all: true
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 120
      tab-width: 1
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 4
    testpackage:
      skip-regexp: (export|internal)_test\.go
    whitespace:
      multi-if: false
      multi-func: false
    wsl:
      strict-append: true
      allow-assign-and-call: true
      allow-multiline-assign: true
      force-case-trailing-whitespace: 0
      allow-trailing-comment: true
      allow-separated-leading-comment: false
      allow-cuddle-declarations: false
      force-err-cuddling: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Field order across li is chosen for something a size-ordered layout would lose:
      # - li/iri's record structs follow the member order of the TS 33.128 ASN.1 SEQUENCEs they
      #   encode, and the tag audit in li/iri/emit_tags_test.go walks them in that order
      #   against the emitted encoding, so a reorder breaks the audit, not only readability.
      # - li/x1's message structs follow the TS 103 221-1 XSD sequences, so each reads against
      #   its schema type. Decoding is by element name and responses are rendered from
      #   templates, so this is readability, not wire order.
      # - The stateful types (x2x3.Client, x1.Reporter, the watchers, the store) keep each
      #   field beside the mutex that guards it and the comment saying so.
      # - The test tables use positional literals, which a reorder would break or, between
      #   fields of one type, silently re-pair.
      # The network-function repositories disable this check entirely.
      - path: ^li/
        linters:
          - govet
        text: fieldalignment
      # li's tests assert against record and field names and disposition text taken from the
      # specification tables; naming each repeated literal would hide what is being checked.
      - path: ^li/.*_test\.go$
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  uniq-by-line: true
  new-from-rev: ""
  new: false
severity:
  default: error
  rules:
    - linters:
        - mnd
      severity: ignore
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/omec-project
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
